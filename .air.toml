root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/diary ./cmd/diary"
  full_bin = "./tmp/diary serve"
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "data", "models", "deploy", ".git", "docs", "mobile"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
