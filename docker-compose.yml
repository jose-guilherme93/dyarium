# Deploy de producao do dyarium.
#
# Uso direto:
#   docker compose up -d
#
# Nenhuma variavel de ambiente e obrigatoria: na primeira subida o servidor
# gera e guarda a chave mestra e o token no volume de dados. Acesse a porta
# publicada e conclua o primeiro acesso em /setup.
#
# Para o Dokploy, cole este arquivo como um servico Compose e aponte o dominio
# para a porta 8080 do servico.
services:
  dyarium:
    image: ghcr.io/jose-guilherme93/dyarium:${DIARY_VERSION:-latest}
    container_name: dyarium
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${DIARY_PORT:-8080}:8080"
    volumes:
      - dyarium-data:/data
      - dyarium-models:/models
    environment:
      DIARY_LOG_LEVEL: ${DIARY_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Analise de IA local (opcional, sem chave). O painel configura em um clique
  # (Configuracao > Analise por IA > Ollama local) e baixa o modelo.
  # Uso: docker compose --profile ai up -d ollama
  # Num modelo grande nao cabe no limite de 900 MB; use um modelo pequeno.
  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    restart: unless-stopped
    cpus: "2"
    mem_limit: 900m
    volumes:
      - ollama-models:/root/.ollama

volumes:
  dyarium-data:
  dyarium-models:
  ollama-models:
