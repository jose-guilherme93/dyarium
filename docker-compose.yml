# Deploy de producao do dyarium.
#
# Uso direto:
#   docker compose up -d
#
# Nenhuma variavel de ambiente e obrigatoria: na primeira subida o servidor
# gera e guarda a chave mestra e o token no volume de dados. Acesse a porta
# publicada e conclua o primeiro acesso em /setup.
#
# Para o Dokploy, cole este arquivo como um servico Compose e aponte o dominio
# para a porta 8080 do servico.
services:
  dyarium:
    image: ghcr.io/jose-guilherme93/dyarium:${DIARY_VERSION:-latest}
    container_name: dyarium
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${DIARY_PORT:-8080}:8080"
    volumes:
      - dyarium-data:/data
      - dyarium-models:/models
    environment:
      DIARY_LOG_LEVEL: ${DIARY_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Analise de IA local (sem chave). Sobe junto com o dyarium para que o botao
  # "Ollama local" funcione sem comando extra; o modelo so e carregado quando a
  # analise roda e sai da memoria depois de alguns minutos parado.
  #
  # Memoria: o servico ocioso consome ~150-250 MB e o modelo padrao
  # (qwen2.5:0.5b) ~600 MB durante a geracao. Com 1 GB de RAM nao cabe junto da
  # transcricao; o minimo realista e 2 GB. Modelo grande nao cabe em 900 MB.
  # Para nao subir o Ollama, use `docker compose up -d dyarium` (sem o servico)
  # ou o runtime embutido nas configuracoes do dashboard.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    cpus: "2"
    mem_limit: 900m
    environment:
      # Um modelo por vez e sem paralelismo: o alvo e uma VPS pequena.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  dyarium-data:
  dyarium-models:
  ollama-models:
